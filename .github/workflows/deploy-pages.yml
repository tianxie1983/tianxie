name: Deploy to GitHub Pages

# 每当 web/ 目录有变化（含每日 CI 更新的 data.js）自动部署到 GitHub Pages。
# 前提：仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"。
# 启用后站点地址：https://tianxie1983.github.io/tianxie/zjds/ （根路径 /tianxie/ 自动 302 跳转至此）

on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch: {}
  # 关键修复：price-update 用 GITHUB_TOKEN 推送的提交不会触发上面的 on.push（GitHub 防循环机制），
  # 导致站点一直停在旧版本。改用 workflow_run：price-update 一跑完就自动触发本部署，无需人工干预。
  workflow_run:
    workflows: ["每日自动更新配件价格"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新推送取消旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload web/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
