name: 定时更新配件价格

on:
  # 价格抓取已改由本机定时脚本 scripts/scheduled-update.js 完成（方案 C：GitHub Actions 美国机房 IP 会被 ZOL 限流，且本仓库无中国出口代理）。
  # 此处仅保留手动触发：将来若在仓库 Secrets 配置了 ZOL_PROXY，可在此手动跑一次 CI 抓价。
  workflow_dispatch: {}      # 允许在 Actions 页面手动触发

permissions:
  contents: write            # 允许工作流提交并推送 data.js

jobs:
  update-prices:
    runs-on: ubuntu-latest
    env:
      # GitHub Actions 美国机房 IP 会被 ZOL 限流(403/429/503)，必须经中国出口代理才能拿到价格。
      # 代理地址配置在仓库 Secrets: Settings -> Secrets and variables -> Actions -> New repository secret
      # 名称 ZOL_PROXY，值形如 http://host:port 或 http://user:pass@host:port（不要明文写在代码里）。
      ZOL_PROXY: ${{ secrets.ZOL_PROXY }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取最新价格并生成 data.js
        run: node scripts/price-fetch.js

      - name: 仅在有变化时刷新缓存版本号并提交
        run: |
          git config user.name "price-bot"
          git config user.email "bot@workbuddy.local"
          if git diff --quiet web/data.js; then
            echo "价格无变化，跳过本次部署"
          else
            node scripts/versionize.js
            git add web/data.js web/index.html
            git commit -m "chore: 自动更新配件价格 $(date +%F)"
            git push
            echo "已推送新价格，Netlify 将自动重新部署"
          fi
