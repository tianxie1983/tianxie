# 装机大师 · Nginx 静态站点配置示例
# 用法：把本文件内容并入你的站点 server 块，或保存为 /etc/nginx/conf.d/pc-build.conf 后 reload
server {
    listen 80;
    # listen 443 ssl;  # 生产环境请启用 HTTPS 并配置证书
    server_name your-domain.com;   # 改成你的域名

    root /path/to/web;             # 改成 web/ 目录的绝对路径
    index index.html;

    # SPA 单页：所有路径回退到 index.html（本站点无 URL 路由，可省略）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
