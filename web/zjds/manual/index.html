<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2433" />
  <title>装机大师 · 手动报价</title>
  <style>
    :root {
      --primary: #3a7afe;
      --primary-dark: #2b5fe0;
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2433;
      --text-sub: #6b7280;
      --price: #ff5a3c;
      --ok: #18a058;
      --warn: #f0a020;
      --bad: #e54848;
      --line: #eceef2;
      --tab-h: 58px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #dfe2e8;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Helvetica, sans-serif;
      font-size: 15px; line-height: 1.5;
    }
    #phone { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); position: relative; display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,0.12); }
    #view { flex: 1; padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom)); }
    button { font-family: inherit; cursor: pointer; }
    .card { background: var(--card); border-radius: 14px; box-shadow: 0 2px 12px rgba(31,36,51,0.05); }
    .price { color: var(--price); font-weight: 700; }
    .price-symbol { font-size: 12px; }
    .price-unit { font-size: 12px; color: var(--text-sub); font-weight: 400; }
    .tag { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; background: #eef3ff; color: var(--primary); margin-right: 6px; }
    .tag.gray { background: #f0f1f4; color: var(--text-sub); }
    .tag.hot { background: #ffece6; color: var(--price); }
    .section-title { font-size: 17px; font-weight: 800; margin: 18px 14px 8px; display: flex; align-items: center; }
    .section-title::before { content: ""; width: 4px; height: 16px; background: var(--primary); border-radius: 3px; margin-right: 8px; }
    .hidden { display: none !important; }

    .hero { margin: 14px; padding: 20px 18px; border-radius: 16px; background: linear-gradient(135deg, #2b8a5e, #18a058); color: #fff; box-shadow: 0 8px 22px rgba(24,160,88,0.32); }
    .hero-title { font-size: 24px; font-weight: 800; letter-spacing: 1px; }
    .hero-sub { font-size: 12.5px; opacity: .92; margin-top: 6px; }
    .hero-meta { font-size: 12px; opacity: .9; margin-top: 10px; background: rgba(255,255,255,.16); display: inline-block; padding: 4px 11px; border-radius: 999px; }

    .toolbar { display: flex; gap: 8px; padding: 0 14px 4px; flex-wrap: wrap; }
    .tool-btn { flex: 1; min-width: 96px; padding: 9px 10px; border: 1px solid var(--line); background: #fff; border-radius: 11px; font-size: 13px; font-weight: 600; color: var(--text); }
    .tool-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .tool-btn.warn { color: var(--bad); border-color: #f6d2d2; }
    .tool-btn:active { transform: scale(.97); }

    .cat-head { display: flex; align-items: center; padding: 16px 8px 8px 18px; }
    .cat-head-icon { font-size: 30px; margin-right: 11px; }
    .cat-head-name { font-size: 19px; font-weight: 800; }
    .cat-head-desc { font-size: 12px; color: var(--text-sub); margin-top: 3px; }
    .part { display: flex; align-items: center; justify-content: space-between; padding: 13px 15px; margin: 0 14px 9px; }
    .part-main { flex: 1; min-width: 0; }
    .part-name { font-size: 15px; font-weight: 600; }
    .part-spec { font-size: 12px; color: var(--text-sub); margin-top: 4px; }
    .part-brand { font-size: 11px; color: #aab0bb; margin-top: 3px; }
    .part-side { text-align: right; margin-left: 11px; }
    .part-price { font-size: 16px; }
    .edit-input { width: 92px; font-size: 16px; font-weight: 700; color: var(--price); border: 1px solid var(--primary); border-radius: 8px; padding: 5px 8px; text-align: right; outline: none; }
    .saved-flag { font-size: 10px; color: var(--ok); margin-top: 3px; }

    .footer { text-align: center; color: #b3b8c2; font-size: 11px; margin: 18px 0; line-height: 1.7; }

    .tabbar { position: fixed; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; height: var(--tab-h); display: flex; background: #fff; border-top: 1px solid var(--line); z-index: 10; padding-bottom: env(safe-area-inset-bottom); }
    .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-sub); font-size: 11px; }
    .tab .ti { font-size: 21px; }
    .tab.active { color: var(--primary); }

    .build-card { padding: 13px 15px; margin: 0 14px 11px; }
    .build-row { display: flex; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .build-row:last-child { border-bottom: none; }
    .br-cat { width: 64px; font-size: 12px; color: var(--text-sub); flex-shrink: 0; }
    .br-sel { flex: 1; }
    .br-sel select { width: 100%; font-size: 14px; padding: 7px 6px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--text); }
    .br-price { width: 86px; text-align: right; font-size: 14px; }
    .issues { margin: 4px 14px 0; }
    .issue { font-size: 12px; padding: 9px 12px; border-radius: 9px; margin-bottom: 7px; display: flex; align-items: center; }
    .issue.bad { background: #fdecec; color: var(--bad); }
    .issue.warn { background: #fdf3e3; color: var(--warn); }
    .issue.ok { background: #e7f7ee; color: var(--ok); }
    .summary { position: fixed; left: 0; right: 0; bottom: var(--tab-h); max-width: 480px; margin: 0 auto; display: flex; align-items: center; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: #fff; box-shadow: 0 -2px 12px rgba(0,0,0,0.06); }
    .summary-info { flex: 1; }
    .summary-total { font-size: 14px; }
    .summary-total .price { font-size: 21px; }
    .summary-sub { font-size: 11px; color: var(--text-sub); margin-top: 3px; }
    .save-btn { margin: 0 0 0 11px; padding: 0 20px; line-height: 44px; border: none; border-radius: 999px; background: var(--primary); color: #fff; font-size: 14px; font-weight: 600; }

    .saved-item { padding: 14px 15px; margin: 0 14px 11px; }
    .saved-head { display: flex; align-items: baseline; justify-content: space-between; }
    .saved-name { font-size: 16px; font-weight: 800; }
    .saved-head .price { font-size: 18px; }
    .saved-time { font-size: 11px; color: var(--text-sub); margin-top: 4px; }
    .saved-parts { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
    .sp { display: flex; align-items: center; padding: 3px 0; font-size: 13px; }
    .sp-icon { margin-right: 7px; }
    .sp-cat { width: 52px; color: var(--text-sub); flex-shrink: 0; }
    .sp-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .saved-del { font-size: 12px; color: var(--bad); margin-top: 8px; display: inline-block; }

    .data-row { display: flex; align-items: center; padding: 13px 15px; margin: 0 14px 9px; justify-content: space-between; }
    .data-row .dr-label { font-size: 14px; font-weight: 600; }
    .data-row .dr-sub { font-size: 11px; color: var(--text-sub); margin-top: 3px; }
    .file-input { display: none; }
    .toast { position: fixed; left: 50%; top: 24%; transform: translateX(-50%); background: rgba(31,36,51,.92); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px; z-index: 50; opacity: 0; transition: opacity .25s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="phone">
    <div id="view">
      <div class="hero">
        <div class="hero-title">装机大师 · 手动报价</div>
        <div class="hero-sub">价格由您手动维护，无需联网抓取，适合门店报价与方案保存</div>
        <div class="hero-meta" id="heroMeta">数据状态：加载中…</div>
      </div>

      <!-- 配件价格 -->
      <div id="viewCatalog">
        <div class="toolbar">
          <button class="tool-btn primary" id="editToggle">✎ 改价格</button>
          <button class="tool-btn hidden" id="savePrices">💾 保存修改</button>
          <button class="tool-btn hidden" id="cancelEdit">取消</button>
        </div>
        <div id="catalogList"></div>
      </div>

      <!-- 我的装机 -->
      <div id="viewBuild" class="hidden">
        <div class="section-title">搭配装机单</div>
        <div class="card build-card" id="buildEditor"></div>
        <div class="issues" id="buildIssues"></div>
        <div class="section-title">已保存方案</div>
        <div id="savedList"></div>
      </div>

      <!-- 数据维护 -->
      <div id="viewData" class="hidden">
        <div class="section-title">数据维护</div>
        <div class="card data-row">
          <div><div class="dr-label">导出当前数据</div><div class="dr-sub">下载 JSON 文件，含所有手动价格</div></div>
          <button class="tool-btn primary" id="exportBtn">导出</button>
        </div>
        <div class="card data-row">
          <div><div class="dr-label">导入数据文件</div><div class="dr-sub">用导出的 JSON 覆盖当前价格与清单</div></div>
          <button class="tool-btn" id="importBtn">导入</button>
        </div>
        <div class="card data-row">
          <div><div class="dr-label">恢复内置默认价</div><div class="dr-sub">清空所有手动修改，回到初始数据</div></div>
          <button class="tool-btn warn" id="resetBtn">恢复</button>
        </div>
        <div class="footer">手动维护模式 · 价格仅保存在本浏览器<br/>导出 JSON 后可由管理员发布为线上报价</div>
      </div>
    </div>

    <div class="summary hidden" id="buildSummary">
      <div class="summary-info">
        <div class="summary-total">合计 <span class="price">¥<span id="sumTotal">0</span></span></div>
        <div class="summary-sub" id="sumSub">预估功耗 0W</div>
      </div>
      <button class="save-btn" id="saveBuild">保存方案</button>
    </div>

    <div class="tabbar">
      <div class="tab active" data-tab="catalog"><div class="ti">🛒</div>配件价格</div>
      <div class="tab" data-tab="build"><div class="ti">🧩</div>我的装机</div>
      <div class="tab" data-tab="data"><div class="ti">⚙️</div>数据</div>
    </div>
  </div>

  <input type="file" id="fileInput" class="file-input" accept="application/json,.json" />
  <div class="toast" id="toast"></div>

{"label":"认证","value":"80PLUS 金牌"},{"label":"模组","value":"全模组"}],"priceSource":"manual"},{"category":"psu","id":"psu-1200","name":"全汉 1200W 白金","brand":"FSP","price":1499,"power":0,"watt":1200,"specs":[{"label":"额定","value":"1200W"},{"label":"认证","value":"80PLUS 白金"},{"label":"模组","value":"全模组"}],"priceSource":"manual"},{"category":"chassis","id":"chassis-m2","name":"先马 平头哥 M2","brand":"SAMA","price":159,"power":5,"specs":[{"label":"板型","value":"M-ATX"},{"label":"材质","value":"钢化玻璃侧透"},{"label":"风冷限高","value":"165mm"}],"priceSource":"zol","url":"https://detail.zol.com.cn/case/index1980292.shtml"},{"category":"chassis","id":"chassis-d31","name":"乔思伯 D31 网孔版","brand":"JONSBO","price":399,"power":5,"specs":[{"label":"板型","value":"M-ATX"},{"label":"屏幕位","value":"可选副屏"},{"label":"风冷限高","value":"168mm"}],"priceSource":"manual"},{"category":"chassis","id":"chassis-623","name":"追风者 623","brand":"Phanteks","price":499,"power":5,"hot":true,"specs":[{"label":"板型","value":"ATX"},{"label":"材质","value":"钢化玻璃侧透"},{"label":"水冷支持","value":"360 冷排"}],"priceSource":"manual"},{"category":"chassis","id":"chassis-o11","name":"联力 包豪斯 O11","brand":"LianLi","price":699,"power":5,"specs":[{"label":"板型","value":"ATX"},{"label":"材质","value":"双面钢化玻璃"},{"label":"水冷支持","value":"360 冷排"}],"priceSource":"manual"},{"category":"chassis","id":"chassis-luban1","name":"先马 鲁班1","brand":"SAMA","price":299,"power":5,"specs":[{"label":"板型","value":"ATX"},{"label":"材质","value":"钢化玻璃侧透"},{"label":"水冷支持","value":"360 冷排"}],"priceSource":"manual"},{"category":"chassis","id":"chassis-yogo","name":"爱国者 YOGO M2","brand":"aigo","price":159,"power":5,"specs":[{"label":"板型","value":"M-ATX"},{"label":"材质","value":"网孔面板"},{"label":"风冷限高","value":"168mm"}],"priceSource":"zol","url":"https://detail.zol.com.cn/case/index1980292.shtml"},{"category":"chassis","id":"chassis-nr400","name":"酷冷 NR400","brand":"CoolerMaster","price":329,"power":5,"specs":[{"label":"板型","value":"M-ATX"},{"label":"材质","value":"侧透"},{"label":"风冷限高","value":"167mm"}],"priceSource":"manual"},{"category":"chassis","id":"chassis-207","name":"联力 鬼斧207","brand":"LianLi","price":499,"power":5,"hot":true,"specs":[{"label":"板型","value":"ATX"},{"label":"材质","value":"双仓设计"},{"label":"水冷支持","value":"360 冷排"}],"priceSource":"manual"},{"category":"chassis","id":"chassis-p20c","name":"安钛克 P20C","brand":"Antec","price":399,"power":5,"specs":[{"label":"板型","value":"ATX"},{"label":"材质","value":"网孔面板"},{"label":"水冷支持","value":"360 冷排"}],"priceSource":"manual"},{"category":"chassis","id":"chassis-xt523","name":"追风者 XT523","brand":"Phanteks","price":459,"power":5,"specs":[{"label":"板型","value":"ATX"},{"label":"材质","value":"钢化玻璃侧透"},{"label":"水冷支持","value":"360 冷排"}],"priceSource":"manual"}]};
    var LS = {
      prices: "zjds_manual_prices_v1",
      data: "zjds_manual_data_v1",
      meta: "zjds_manual_meta_v1",
      build: "zjds_manual_curbuild_v1",
      builds: "zjds_manual_savedbuilds_v1"
    };

    function load(k, def) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
    function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

    var priceOverrides = load(LS.prices, {});
    var dataOverride = load(LS.data, null);
    var meta = load(LS.meta, null);
    var curBuild = load(LS.build, {});
    var savedBuilds = load(LS.builds, []);

    function effectiveParts() {
      var base = (dataOverride && dataOverride.parts) ? dataOverride.parts : BASE.parts;
      return base.map(function (p) {
        if (priceOverrides[p.id] != null) { var c = {}; for (var k in p) c[k] = p[k]; c.price = priceOverrides[p.id]; c.edited = true; return c; }
        return p;
      });
    }
    function effectiveCategories() {
      return (dataOverride && dataOverride.categories) ? dataOverride.categories : BASE.categories;
    }
    function partById(id) { var a = effectiveParts(); for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }
    function catParts(key) { return effectiveParts().filter(function (p) { return p.category === key; }); }

    var editing = false;
    var $ = function (id) { return document.getElementById(id); };

    function toast(msg) {
      var t = $("toast"); t.textContent = msg; t.classList.add("show");
      clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove("show"); }, 1600);
    }
    function fmt(n) { return (n == null ? 0 : n).toLocaleString("zh-CN"); }
    function yuan(n) { return "¥" + fmt(n); }

    function renderMeta() {
      var el = $("heroMeta");
      if (meta && meta.updatedAt) {
        var d = new Date(meta.updatedAt);
        var s = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
        var cnt = Object.keys(priceOverrides).length + (dataOverride ? effectiveParts().length : 0);
        el.textContent = "✓ 已手动维护 · 最后更新 " + s;
      } else {
        el.textContent = "○ 未修改 · 当前为内置参考价";
      }
    }

    function renderCatalog() {
      var wrap = $("catalogList");
      var html = "";
      effectiveCategories().forEach(function (cat) {
        var list = catParts(cat.key);
        if (!list.length) return;
        html += '<div class="cat-head"><div class="cat-head-icon">' + cat.icon + '</div><div><div class="cat-head-name">' + cat.name + '</div><div class="cat-head-desc">' + (cat.desc || "") + '</div></div></div>';
        list.forEach(function (p) {
          var specs = (p.specs || []).slice(0, 2).map(function (s) { return s.value; }).join(" · ");
          var priceHtml;
          if (editing) {
            priceHtml = '<input class="edit-input" type="number" min="0" step="1" data-id="' + p.id + '" value="' + p.price + '" />';
          } else {
            priceHtml = '<div class="part-price price">' + yuan(p.price) + '</div>' + (p.edited ? '<div class="saved-flag">已改</div>' : '');
          }
          html += '<div class="card part">' +
            '<div class="part-main"><div class="part-name">' + p.name + (p.hot ? ' <span class="tag hot">热</span>' : '') + '</div>' +
            (specs ? '<div class="part-spec">' + specs + '</div>' : '') +
            '<div class="part-brand">' + (p.brand || "") + '</div></div>' +
            '<div class="part-side">' + priceHtml + '</div></div>';
        });
      });
      wrap.innerHTML = html;
    }

    function toggleEdit() {
      editing = !editing;
      $("editToggle").classList.toggle("hidden", editing);
      $("savePrices").classList.toggle("hidden", !editing);
      $("cancelEdit").classList.toggle("hidden", !editing);
      renderCatalog();
    }
    function savePrices() {
      var inputs = document.querySelectorAll(".edit-input");
      inputs.forEach(function (inp) {
        var id = inp.getAttribute("data-id");
        var v = parseFloat(inp.value);
        if (!isNaN(v) && v >= 0) priceOverrides[id] = Math.round(v);
      });
      save(LS.prices, priceOverrides);
      meta = { updatedAt: new Date().toISOString() }; save(LS.meta, meta);
      editing = false;
      $("editToggle").classList.remove("hidden");
      $("savePrices").classList.add("hidden");
      $("cancelEdit").classList.add("hidden");
      renderCatalog(); renderMeta(); renderBuild();
      toast("已保存 " + Object.keys(priceOverrides).length + " 项价格修改");
    }

    function renderBuild() {
      var cats = effectiveCategories();
      var html = "";
      cats.forEach(function (cat) {
        var list = catParts(cat.key);
        var sel = '<select data-cat="' + cat.key + '"><option value="">— 选择' + cat.name + ' —</option>';
        list.forEach(function (p) {
          var picked = curBuild[cat.key] === p.id ? " selected" : "";
          sel += '<option value="' + p.id + '"' + picked + '>' + p.name + ' · ' + yuan(p.price) + '</option>';
        });
        sel += "</select>";
        html += '<div class="build-row"><div class="br-cat">' + cat.icon + " " + cat.name + '</div><div class="br-sel">' + sel + '</div></div>';
      });
      $("buildEditor").innerHTML = html;
      bindSelects();
      computeBuild();
    }

    function bindSelects() {
      document.querySelectorAll("#buildEditor select").forEach(function (s) {
        s.onchange = function () {
          var cat = s.getAttribute("data-cat");
          if (s.value) curBuild[cat] = s.value; else delete curBuild[cat];
          save(LS.build, curBuild);
          computeBuild();
        };
      });
    }

    function computeBuild() {
      var items = [], total = 0, power = 0;
      var cpu = partById(curBuild.cpu), mb = partById(curBuild.motherboard), mem = partById(curBuild.memory), psu = partById(curBuild.psu);
      effectiveCategories().forEach(function (cat) {
        var id = curBuild[cat.key]; if (!id) return;
        var p = partById(id); if (!p) return;
        items.push(p); total += (p.price || 0); if (p.power) power += p.power;
      });
      $("sumTotal").textContent = fmt(total);
      $("sumSub").textContent = "预估功耗 " + power + "W · 共 " + items.length + " 件";
      $("buildSummary").classList.toggle("hidden", items.length === 0);

      var issues = [];
      if (cpu && mb && cpu.socket && mb.socket && cpu.socket !== mb.socket)
        issues.push({ t: "bad", m: "CPU 插槽 " + cpu.socket + " 与主板 " + mb.socket + " 不匹配" });
      if (cpu && mem && cpu.memType && mem.memType && cpu.memType !== mem.memType)
        issues.push({ t: "warn", m: "CPU 内存类型 " + cpu.memType + " 与内存 " + mem.memType + " 不一致" });
      if (psu && psu.watt && power > psu.watt)
        issues.push({ t: "bad", m: "整机功耗 " + power + "W 超过电源额定 " + psu.watt + "W" });
      if (items.length && !issues.length) issues.push({ t: "ok", m: "兼容性检查通过" });
      var ih = "";
      issues.forEach(function (i) { ih += '<div class="issue ' + i.t + '">● ' + i.m + '</div>'; });
      $("buildIssues").innerHTML = ih;
    }

    function saveBuild() {
      var items = []; effectiveCategories().forEach(function (cat) { var id = curBuild[cat.key]; if (id) { var p = partById(id); if (p) items.push(p); } });
      if (!items.length) { toast("请先选择配件"); return; }
      var name = prompt("给这套方案起个名字：", "我的装机方案");
      if (name === null) return;
      if (!name) name = "未命名方案";
      var total = 0, power = 0; items.forEach(function (p) { total += p.price || 0; if (p.power) power += p.power; });
      savedBuilds.unshift({ name: name, items: items.map(function (p) { return { cat: p.category, id: p.id, name: p.name, price: p.price }; }), total: total, power: power, time: new Date().toISOString() });
      save(LS.builds, savedBuilds);
      renderSaved(); toast("方案已保存");
    }

    function renderSaved() {
      var wrap = $("savedList");
      if (!savedBuilds.length) { wrap.innerHTML = '<div class="footer">暂无已保存方案</div>'; return; }
      var html = "";
      var catName = {}; effectiveCategories().forEach(function (c) { catName[c.key] = c.name; });
      savedBuilds.forEach(function (b, idx) {
        var parts = b.items.map(function (it) {
          return '<div class="sp"><span class="sp-icon">' + (catIcon(it.cat)) + '</span><span class="sp-cat">' + (catName[it.cat] || it.cat) + '</span><span class="sp-name">' + it.name + '</span><span class="price"> ' + yuan(it.price) + '</span></div>';
        }).join("");
        var d = new Date(b.time);
        var ds = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
        html += '<div class="card saved-item"><div class="saved-head"><div class="saved-name">' + b.name + '</div><div class="price">' + yuan(b.total) + '</div></div>' +
          '<div class="saved-time">' + ds + ' · 功耗 ' + (b.power || 0) + 'W</div>' +
          '<div class="saved-parts">' + parts + '</div>' +
          '<span class="saved-del" data-del="' + idx + '">删除此方案</span></div>';
      });
      wrap.innerHTML = html;
      wrap.querySelectorAll(".saved-del").forEach(function (el) {
        el.onclick = function () { var i = parseInt(el.getAttribute("data-del"), 10); savedBuilds.splice(i, 1); save(LS.builds, savedBuilds); renderSaved(); };
      });
    }
    function catIcon(key) { var c = effectiveCategories().filter(function (x) { return x.key === key; })[0]; return c ? c.icon : "•"; }

    function exportData() {
      var data = { categories: effectiveCategories(), parts: effectiveParts().map(function (p) { var c = {}; for (var k in p) if (k !== "edited") c[k] = p[k]; return c; }), source: "manual", updatedAt: new Date().toISOString() };
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "zjds-prices-" + new Date().toISOString().slice(0, 10) + ".json";
      a.click();
      toast("已导出数据文件");
    }

    function importData(file) {
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(reader.result);
          if (!data.parts || !Array.isArray(data.parts)) throw new Error("缺少 parts 数组");
          if (!data.categories || !Array.isArray(data.categories)) data.categories = effectiveCategories();
          dataOverride = { categories: data.categories, parts: data.parts };
          priceOverrides = {};
          save(LS.data, dataOverride); save(LS.prices, priceOverrides);
          meta = { updatedAt: new Date().toISOString() }; save(LS.meta, meta);
          curBuild = {}; save(LS.build, curBuild);
          renderMeta(); renderCatalog(); renderBuild();
          toast("已导入 " + data.parts.length + " 项配件");
        } catch (e) { toast("导入失败：" + e.message); }
      };
      reader.readAsText(file);
    }

    function resetAll() {
      if (!confirm("确定恢复内置默认价？将清空所有手动修改与导入数据。")) return;
      priceOverrides = {}; dataOverride = null; meta = null;
      localStorage.removeItem(LS.prices); localStorage.removeItem(LS.data); localStorage.removeItem(LS.meta);
      renderMeta(); renderCatalog(); renderBuild();
      toast("已恢复默认数据");
    }

    // tabs
    document.querySelectorAll(".tab").forEach(function (t) {
      t.onclick = function () {
        document.querySelectorAll(".tab").forEach(function (x) { x.classList.remove("active"); });
        t.classList.add("active");
        var tab = t.getAttribute("data-tab");
        $("viewCatalog").classList.toggle("hidden", tab !== "catalog");
        $("viewBuild").classList.toggle("hidden", tab !== "build");
        $("viewData").classList.toggle("hidden", tab !== "data");
      };
    });

    $("editToggle").onclick = toggleEdit;
    $("savePrices").onclick = savePrices;
    $("cancelEdit").onclick = function () { editing = false; $("editToggle").classList.remove("hidden"); $("savePrices").classList.add("hidden"); $("cancelEdit").classList.add("hidden"); renderCatalog(); };
    $("exportBtn").onclick = exportData;
    $("importBtn").onclick = function () { $("fileInput").click(); };
    $("fileInput").onchange = function () { if (this.files && this.files[0]) importData(this.files[0]); this.value = ""; };
    $("resetBtn").onclick = resetAll;
    $("saveBuild").onclick = saveBuild;

    renderMeta();
    renderCatalog();
    renderBuild();
    renderSaved();
  })();
  </script>
